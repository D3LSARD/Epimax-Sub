name: 🚀 Auto Collector &amp; Telegram Publisher on: schedule: # اجرا هر ۲ ساعت یک‌بار به‌صورت خودکار و ۲۴ ساعته - cron: '0 \*/2 \* \* \*' workflow\_dispatch: # دکمه اجرای دستی برای تست هر زمان که مایل بودید concurrency: group: collector-run cancel-in-progress: true jobs: run-pipeline: runs-on: ubuntu-latest timeout-minutes: 45 steps: - name: 📥 دریافت آخرین کدها از مخزن uses: actions/checkout@v4 with: fetch-depth: 1 - name: 🐍 نصب پایتون uses: actions/setup-python@v5 with: python-version: '3.11' cache: 'pip' - name: 📦 نصب کتابخانه‌های مورد نیاز run: | python -m pip install --upgrade pip if [ -f requirements.txt ]; then pip install -r requirements.txt; fi pip install requests python-dotenv - name: ⚙️ اجرای اسکریپت پایتون، ساخت ساب و ارسال به تلگرام env: TG\_BOT\_TOKEN: ${{ secrets.TG\_BOT\_TOKEN }} TG\_CHANNEL\_ID: ${{ secrets.TG\_CHANNEL\_ID }} run: | python collector.py - name: 💾 ذخیره و انتشار فایل‌های جدید در گیت‌هاب run: | git config --local user.email "github-actions[bot]@users.noreply.github.com" git config --local user.name "github-actions[bot]" git add sub.txt vip\_links.txt slipnet\_vip.txt \*.txt 2&gt;/dev/null || true git diff --staged --quiet || (git commit -m "🤖 بروزرسانی خودکار سابسکریپشن و کانفیگ‌ها [skip ci]" &amp;&amp; git push)
